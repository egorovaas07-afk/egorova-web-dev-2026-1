<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратная связь — Food Construct</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Food Construct</h1>

    <nav>
      <a href="index.html">Главная</a>
      <a href="login.html">Войти</a>
      <a href="#lunch">Собрать ланч</a>
      <a href="#orders">Заказы</a>
      <a href="feedback.html">Обратная связь</a>
      <a href="#contacts">Контакты</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Форма обратной связи</h2>

      <form action="https://httpbin.org/post" method="POST"
        enctype="multipart/form-data">

        <label for="full-name">ФИО:</label>
        <input
          type="text"
          id="full-name"
          name="full_name"
          required>

        <label for="email">Email:</label>
        <input
          type="text"
          id="email"
          name="email"
          required>

        <fieldset>
          <legend>Откуда вы узнали о нас?</legend>

          <label>
            <input
              type="radio"
              name="source"
              value="internet"
              required>
            Интернет
          </label>

          <label>
            <input
              type="radio"
              name="source"
              value="friends">
            От друзей
          </label>

          <label>
            <input
              type="radio"
              name="source"
              value="advertising">
            Реклама
          </label>
        </fieldset>

        <label for="appeal-type">Тип обращения:</label>
        <select id="appeal-type" name="appeal_type">
          <option value="complaint">Жалоба</option>
          <option value="suggestion">Предложение</option>
        </select>

        <label for="message">Текст сообщения:</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required></textarea>

        <label for="attachment">Вложение:</label>
        <input
          type="file"
          id="attachment"
          name="attachment">

        <label>
          <input
            type="checkbox"
            name="personal_data"
            required>
          Даю согласие на обработку персональных данных
        </label>

        <button type="submit">Отправить</button>

      </form>
    </section>
  </main>

  <footer id="contacts">
    <p>
      Позвонить нам:
      <a href="tel:+70000000000">+7-000-000-00-00</a>
    </p>
  </footer>

</body>
</html>
